[tool.ruff]
extend-exclude = ["migrations/versions"]  # file Alembic sinh tự động
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: sắp xếp import, UP: cú pháp Python mới,
# B: bugbear, T20: cấm print() (dùng logging)
select = ["E", "W", "F", "I", "UP", "B", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["migrations/"]

